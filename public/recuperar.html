<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Tiendachikitin</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body class="fondo" data-page="recuperar">

<header class="nav">
    <button class="icon-btn only-mobile" id="btnMenu" aria-label="Abrir menú">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="brand nav-centro" href="registro.html" aria-label="Tiendachikitin">
        <svg class="logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f79239"/><path d="M11 15l9-5 9 5-9 5-9-5zM11 15v10l9 5 9-5V15M20 20v10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
        <span class="brand-text only-desktop">Tienda<b>chikitin</b></span>
    </a>

    <nav class="nav-links only-desktop" style="margin-right:auto;margin-left:16px">
        <a href="registro.html">Crear cuenta</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>

    <div class="nav-right">
        <a class="icon-btn" href="login.html" aria-label="Iniciar sesión">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/></svg>
        </a>
    </div>
</header>

<div class="drawer" id="drawer">
    <div class="drawer-top">
        <svg class="logo" viewBox="0 0 40 40" width="44" height="44"><circle cx="20" cy="20" r="18" fill="#f79239"/><path d="M11 15l9-5 9 5-9 5-9-5zM11 15v10l9 5 9-5V15M20 20v10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
        <button class="icon-btn" id="btnCerrarMenu" aria-label="Cerrar menú">
            <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>
    <a class="drawer-item" href="registro.html"><span>Crear cuenta</span><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
    <a class="drawer-item" href="login.html"><span>Iniciar sesión</span><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
</div>

<main class="auth">
    <h1>Recuperar <span>contraseña</span></h1>
    <p class="sub">Te enviaremos un código al correo ligado a tu cuenta.</p>
    <div id="mensaje"></div>

    <form id="paso1" novalidate>
        <div class="campo"><input id="correo" type="email" placeholder="Correo electrónico" autocomplete="email" required></div>
        <button class="btn" type="submit">Enviar código</button>
    </form>

    <form id="paso2" class="oculto" novalidate>
        <div class="campo"><input id="codigo" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" autocomplete="one-time-code" required></div>
        <div class="campo"><input id="nueva" type="password" placeholder="Contraseña nueva (mín. 6)" autocomplete="new-password" required></div>
        <button class="btn" type="submit">Cambiar contraseña</button>
    </form>

    <div class="cambio"><a href="login.html">Volver a iniciar sesión</a></div>
    <div class="pie-auth">Tiendachikitin · Punto de venta e inventario corriendo la chikitin engine</div>
</main>

<script src="config.js"></script>
<script src="correo.js"></script>
<script src="db.js"></script>
<script src="auth.js"></script>
</body>
</html>
